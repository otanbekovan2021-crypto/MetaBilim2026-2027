<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MetaBilim — Математикалық мультсаяхат</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Arial,sans-serif;
 background:#eaf3ff;color:#193459;text-align:center
}
[hidden]{display:none!important}
button{
 cursor:pointer;border:0;border-radius:18px;
 padding:14px 22px;margin:6px;
 font-size:clamp(17px,2vw,24px);
 font-weight:bold;background:#fff;color:#193459;
 box-shadow:0 4px 0 #b9c8dc
}
button:hover{filter:brightness(.95)}
button:disabled{opacity:.5;cursor:default}
button.active{background:#ffe17a}
.primary{background:#ffcd42}
h1{font-size:clamp(30px,5vw,55px)}
#intro{
 min-height:100vh;
 display:grid;place-items:center;
 position:relative;overflow:hidden;
 background:linear-gradient(#71cbff 0 66%,#80cb84 66%)
}
.cloud{
 position:absolute;top:10%;left:-25%;
 font-size:70px;animation:cloud 17s linear infinite
}
.cloud.second{top:27%;animation-delay:-8s}
.introtrain{
 position:absolute;bottom:5%;left:-35%;
 font-size:75px;white-space:nowrap;
 animation:train 13s linear infinite
}
.rocket{
 position:absolute;top:10%;left:8%;
 font-size:70px;animation:fly 5s ease-in-out infinite
}
.introcard{
 position:relative;z-index:2;width:min(90%,800px);
 background:#ffffffed;border-radius:35px;
 padding:30px;box-shadow:0 15px 45px #30699b77
}
.introcard p{font-size:clamp(19px,3vw,28px)}
.top{
 padding:20px;
 background:linear-gradient(110deg,#2874db,#7651d7);
 color:white
}
.wrap{max-width:1200px;margin:auto;padding:12px}
.toolbar{margin:12px auto}
.scene{
 height:clamp(300px,40vw,470px);
 position:relative;overflow:hidden;
 border-radius:25px;
 background:linear-gradient(#83d2ff 0 72%,#88d37c 72%);
 box-shadow:0 8px 22px #9db7d3
}
.scene.space{
 background:radial-gradient(circle at 70% 20%,#3f498c,#0a143c)
}
.scene.shop{
 background:linear-gradient(#f8dcac 0 75%,#c99a68 75%)
}
.scene.island{
 background:linear-gradient(#86dcff 0 66%,#f1d68c 66%)
}
.scene.build{
 background:linear-gradient(#91d8ff 0 72%,#91ce81 72%)
}
.decor,.stage{position:absolute;inset:0}
.decor{pointer-events:none}
.sprite{
 position:absolute;
 font-size:clamp(35px,5vw,65px);
 transition:left 1s ease,top 1s ease;
 filter:drop-shadow(0 4px 3px #0002)
}
.trainbody{font-size:clamp(65px,10vw,130px)}
.panel{
 margin-top:15px;background:white;
 border-radius:24px;padding:20px;
 min-height:250px;box-shadow:0 5px 18px #bacfe5
}
#story{font-size:clamp(22px,3vw,32px);min-height:65px}
#question{
 font-size:clamp(28px,4vw,44px);
 font-weight:bold;margin:15px
}
#answers button{
 background:#cfe6ff;
 font-size:clamp(26px,3vw,38px);
 min-width:105px
}
#message{
 font-size:clamp(21px,3vw,30px);
 min-height:45px
}
#counter{font-size:23px}
@keyframes cloud{to{left:120%}}
@keyframes train{to{left:120%}}
@keyframes fly{
 50%{transform:translate(150px,-55px) rotate(-25deg)}
}
@media(prefers-reduced-motion:reduce){
 .cloud,.introtrain,.rocket{animation:none}
 .sprite{transition:none}
}
</style>
</head>
<body>

<div id="intro">
 <div class="cloud">☁️ ☁️</div>
 <div class="cloud second">☁️</div>
 <div class="rocket">🚀</div>
 <div class="introtrain">🚂🚃🚃🚃</div>

 <div class="introcard">
  <div style="font-size:70px">🌈🎬✨</div>
  <h1>Математика әлеміне қош келдің!</h1>
  <p>
   Сиқырлы пойыз, ғарыш, құрылыс,
   дүкен және қазына аралына саяхат жасаймыз!
  </p>
  <button class="primary" onclick="enterGame()">
   🚀 Саяхатты бастау
  </button>
 </div>
</div>

<div id="game" hidden>
<header class="top">
 <h1>🎬 Математикалық мультсаяхат</h1>
 <p>MetaBilim — бірге көрейік, бірге есептейік!</p>
</header>

<main class="wrap">
 <nav id="menu" class="toolbar"></nav>

 <div class="toolbar">
  <button id="musicBtn" onclick="toggleMusic()">
   🎵 Әуенді қосу
  </button>
  <button onclick="toggleFullscreen()">⛶ Толық экран</button>
  <button onclick="goHome()">🏠 Басты бет</button>
  <span id="counter">⭐ 0</span>
 </div>

 <div class="scene" id="scene">
  <div class="decor" id="decor"></div>
  <div class="stage" id="stage"></div>
 </div>

 <section class="panel">
  <h2 id="title"></h2>
  <div id="story"></div>
  <div id="question"></div>
  <div id="answers"></div>
  <div id="message" aria-live="polite"></div>

  <button class="primary" id="startBtn"
   onclick="playScene()">▶️ Көріністі бастау</button>

  <button class="primary" id="nextBtn"
   onclick="nextScene()" hidden>➡️ Келесі көрініс</button>

  <button onclick="choose(selected)">🔄 Қайта бастау</button>
 </section>
</main>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);
const wait = ms => new Promise(resolve=>setTimeout(resolve,ms));

let selected=0,step=0,stars=0;
let busy=false,solved=false,run=0;
let musicOn=false,audio=null,musicTimer=null;

const sets=[
 {
  name:"🚂 Сиқырлы пойыз",
  kind:"train",
  tasks:[
   {a:4,b:3,op:"+",
    text:"Пойызда 4 жолаушы бар. Тағы 3 жолаушы мінеді."},
   {a:8,b:2,op:"-",
    text:"Пойызда 8 жолаушы бар. 2 жолаушы түседі."}
  ]
 },
 {
  name:"🚀 Ғарышқа саяхат",
  kind:"space",
  tasks:[
   {a:5,b:4,op:"+",
    text:"Зымыран 5 санынан 4 қадам алға ұшады."},
   {a:9,b:3,op:"-",
    text:"Зымыран 9 санынан 3 қадам артқа ұшады."}
  ]
 },
 {
  name:"🏠 Сиқырлы құрылыс",
  kind:"build",
  tasks:[
   {a:4,b:2,op:"+",
    text:"Үйде 4 терезе бар. Тағы 2 терезе орнатамыз."},
   {a:6,b:2,op:"-",
    text:"Үйде 6 терезе бар. 2 терезені алып тастаймыз."}
  ]
 },
 {
  name:"🛒 Сиқырлы дүкен",
  kind:"shop",
  tasks:[
   {a:20,b:30,op:"+",
    text:"Алма 20 теңге, шырын 30 теңге. Барлығы қанша?"},
   {a:100,b:40,op:"-",
    text:"100 теңгең бар. 40 теңгеге нан сатып алдың."}
  ]
 },
 {
  name:"🏝️ Қазына аралы",
  kind:"island",
  tasks:[
   {a:7,b:3,op:"-",
    text:"Қазынаға 7 қадам қалды. 3 қадам жүрдің."},
   {a:5,b:5,op:"+",
    text:"Сандықта 5 алтын бар. Тағы 5 алтын табылды."}
  ]
 }
];

function enterGame(){
 $("intro").hidden=true;
 $("game").hidden=false;
 choose(0);
 window.scrollTo(0,0);
}

function goHome(){
 run++;
 busy=false;
 $("game").hidden=true;
 $("intro").hidden=false;
 window.scrollTo(0,0);
}

function clearStage(){
 $("stage").innerHTML="";
 $("decor").innerHTML="";
}

function sprite(txt,left,top,cls=""){
 const e=document.createElement("div");
 e.className="sprite "+cls;
 e.textContent=txt;
 e.style.left=left+"%";
 e.style.top=top+"%";
 $("stage").appendChild(e);
 return e;
}

function decor(txt,left,top){
 const e=document.createElement("div");
 e.className="sprite";
 e.textContent=txt;
 e.style.left=left+"%";
 e.style.top=top+"%";
 $("decor").appendChild(e);
 return e;
}

function choose(n){
 run++;
 selected=n;
 step=0;
 reset();
 sets.forEach((s,i)=>{
  $("tab"+i).classList.toggle("active",i===n);
 });
}

function reset(){
 busy=false;
 solved=false;
 const s=sets[selected];

 $("scene").className="scene "+s.kind;
 $("title").textContent=s.name;
 $("story").textContent="Дайын болсаң, көріністі баста!";
 $("question").textContent="";
 $("answers").innerHTML="";
 $("message").textContent="";
 $("startBtn").hidden=false;
 $("nextBtn").hidden=true;

 clearStage();

 if(s.kind==="train"){
  decor("☀️",85,5);
  decor("🌳",4,55);
  decor("🚏",80,48);
  sprite("🚂🚃",8,43,"trainbody");
 }
 if(s.kind==="space"){
  decor("⭐",8,8);
  decor("🪐",75,12);
  sprite("🚀",8,47);
 }
 if(s.kind==="build"){
  decor("☀️",82,6);
  sprite("🏠",35,34);
  decor("🌳",5,55);
 }
 if(s.kind==="shop"){
  decor("🏪",35,18);
  sprite("🛒",10,62);
  decor("🍎",55,55);
  decor("🧃",70,55);
 }
 if(s.kind==="island"){
  decor("🌴",7,36);
  decor("🌴",85,36);
  decor("💰",85,57);
  sprite("🚶",5,57);
 }
}

async function pause(ms,id){
 await wait(ms);
 if(id!==run)throw Error("cancelled");
}

async function playScene(){
 if(busy)return;
 busy=true;
 solved=false;

 const id=++run;
 const s=sets[selected];
 const t=s.tasks[step];

 $("startBtn").hidden=true;
 $("nextBtn").hidden=true;
 $("story").textContent=t.text;
 $("question").textContent="";
 $("answers").innerHTML="";
 $("message").textContent="";
 clearStage();

 let items=[];

 try{
  if(s.kind==="train"){
   decor("🚏",82,46);
   decor("🌳",4,55);
   const train=sprite("🚂🚃",-25,40,"trainbody");

   await pause(100,id);
   train.style.left="18%";
   await pause(1500,id);

   for(let i=0;i<t.a;i++){
    items.push(sprite("🧍",
     21+(i%4)*10,
     60+Math.floor(i/4)*11));
   }
   await pause(700,id);

   if(t.op==="+"){
    for(let i=0;i<t.b;i++){
     const p=sprite("🚶",78,63);
     await pause(400,id);
     p.style.left=(22+(i%4)*10)+"%";
     p.style.top="60%";
     await pause(950,id);
     p.textContent="🧍";
     items.push(p);
    }
   }else{
    for(let i=0;i<t.b;i++){
     const p=items.pop();
     p.textContent="🚶";
     p.style.left=(70+i*9)+"%";
     await pause(950,id);
    }
   }
  }

  if(s.kind==="space"){
   decor("⭐",12,15);
   decor("🪐",77,13);
   const rocket=sprite("🚀",8,38);
   let current=t.a;

   for(let i=0;i<=t.b;i++){
    const p=decor(String(current),
     10+i*(72/(t.b+1)),72);
    p.style.background="#facc15";
    p.style.padding="4px 12px";
    p.style.borderRadius="50%";

    rocket.style.left=
     (10+i*(70/(t.b+1)))+"%";
    rocket.style.top=(i%2?26:38)+"%";

    current+=t.op==="+"?1:-1;
    await pause(850,id);
   }
  }

  if(s.kind==="build"){
   sprite("🏠",37,31);

   for(let i=0;i<t.a;i++){
    items.push(sprite("🪟",
     39+(i%3)*9,
     47+Math.floor(i/3)*11));
   }
   await pause(700,id);

   if(t.op==="+"){
    for(let i=0;i<t.b;i++){
     const p=sprite("🪟",5,65);
     await pause(350,id);
     p.style.left=
      (39+((t.a+i)%3)*9)+"%";
     p.style.top=
      (47+Math.floor((t.a+i)/3)*11)+"%";
     await pause(1000,id);
    }
   }else{
    for(let i=0;i<t.b;i++){
     const p=items.pop();
     p.style.left="90%";
     p.style.top="85%";
     await pause(850,id);
     p.remove();
    }
   }
  }

  if(s.kind==="shop"){
   decor("🏪",35,10);
   sprite("🛒",14,63);

   if(t.op==="+"){
    const apple=sprite("🍎 20 ₸",54,47);
    const juice=sprite("🧃 30 ₸",73,47);
    await pause(850,id);
    apple.style.left="22%";
    apple.style.top="63%";
    await pause(1150,id);
    juice.style.left="25%";
    juice.style.top="63%";
    await pause(1150,id);
   }else{
    const money=sprite("💵 100 ₸",60,47);
    await pause(850,id);
    money.textContent="🍞 40 ₸";
    money.style.left="24%";
    money.style.top="63%";
    await pause(1300,id);
    decor("💰 60 ₸",65,50);
   }
  }

  if(s.kind==="island"){
   decor("🌴",5,40);
   decor("💰",85,55);
   const person=sprite("🚶",5,57);
   const total=t.op==="-"?t.b:t.a;

   for(let i=0;i<total;i++){
    decor("🪨",15+i*10,78);
    person.style.left=(13+i*10)+"%";
    await pause(850,id);
   }

   if(t.op==="+"){
    for(let i=0;i<t.b;i++){
     const coin=sprite("🪙",
      65+(i%3)*7,
      55+Math.floor(i/3)*10);
     await pause(350,id);
     coin.style.left="85%";
     coin.style.top="54%";
     await pause(550,id);
    }
   }
  }

  await pause(450,id);

  $("question").textContent=
   `${t.a} ${t.op==="-"?"−":"+"} ${t.b} = ?`;
  $("story").textContent=
   "Көргеніңді санап, дұрыс жауапты таңда.";

  showAnswers(t);
  busy=false;
 }catch(e){
  busy=false;
 }
}

function showAnswers(t){
 const answer=t.op==="+"?t.a+t.b:t.a-t.b;
 const delta=answer>=20?10:1;
 let opts=[
  answer,
  answer+delta,
  Math.max(0,answer-delta)
 ];

 if(new Set(opts).size<3){
  opts=[answer,answer+delta,answer+2*delta];
 }

 opts.sort(()=>Math.random()-.5);

 opts.forEach(n=>{
  const b=document.createElement("button");
  b.textContent=n;

  b.onclick=()=>{
   if(solved)return;

   if(n===answer){
    solved=true;
    stars++;
    $("counter").textContent="⭐ "+stars;
    $("message").textContent=
     "🌟 Жарайсың! Дұрыс жауап!";
    $("message").style.color="#15803d";
    $("nextBtn").hidden=false;

    [...$("answers").children].forEach(
     x=>x.disabled=true
    );
    successSound();
   }else{
    $("message").textContent=
     "💛 Тағы бір рет санап көр!";
    $("message").style.color="#b45309";
   }
  };

  $("answers").appendChild(b);
 });
}

function nextScene(){
 step++;

 if(step>=sets[selected].tasks.length){
  run++;
  $("story").textContent=
   "🏆 Бұл саяхат аяқталды!";
  $("question").textContent="";
  $("answers").innerHTML="";
  $("message").textContent=
   "Жарайсың! Басқа саяхатты таңда.";
  $("nextBtn").hidden=true;
  $("startBtn").hidden=true;
  clearStage();
  sprite("🏆🎉⭐",32,34);
  return;
 }

 reset();
 playScene();
}

function toggleFullscreen(){
 if(!document.fullscreenElement){
  document.documentElement.requestFullscreen?.();
 }else{
  document.exitFullscreen?.();
 }
}

function ensureAudio(){
 try{
  if(!audio){
   const Context=
    window.AudioContext||window.webkitAudioContext;
   if(Context)audio=new Context();
  }
  if(audio&&audio.state==="suspended"){
   audio.resume();
  }
 }catch(e){}
}

function tone(freq,duration=.2,volume=.035){
 if(!audio)return;

 const o=audio.createOscillator();
 const g=audio.createGain();
 o.type="sine";
 o.frequency.value=freq;

 g.gain.setValueAtTime(
  volume,audio.currentTime
 );
 g.gain.exponentialRampToValueAtTime(
  .001,audio.currentTime+duration
 );

 o.connect(g);
 g.connect(audio.destination);
 o.start();
 o.stop(audio.currentTime+duration);
}

function toggleMusic(){
 ensureAudio();
 musicOn=!musicOn;

 $("musicBtn").textContent=musicOn
  ?"🔇 Әуенді өшіру":"🎵 Әуенді қосу";

 clearInterval(musicTimer);

 if(musicOn){
  const notes=[262,330,392,330,294,349,440,349];
  let i=0;
  tone(notes[i++],.28,.015);

  musicTimer=setInterval(()=>{
   if(musicOn){
    tone(notes[i++%notes.length],.28,.015);
   }
  },430);
 }
}

function successSound(){
 ensureAudio();
 tone(523,.18,.045);
 setTimeout(()=>tone(659,.18,.045),160);
 setTimeout(()=>tone(784,.28,.045),320);
}

// Бөлімдердің батырмаларын құру
sets.forEach((s,i)=>{
 const b=document.createElement("button");
 b.textContent=s.name;
 b.id="tab"+i;
 b.onclick=()=>choose(i);
 $("menu").appendChild(b);
});

// Бастапқы экран
$("game").hidden=true;
$("intro").hidden=false;
</script>
</body>
</html>
