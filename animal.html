<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Нағыз Жылқы және Анатомия</title>
    <style>
        body { margin: 0; background-color: #f0f0f0; overflow: hidden; font-family: 'Arial', sans-serif; }
        #interface {
            position: absolute; top: 20px; left: 20px;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px; border-radius: 10px; border-left: 5px solid #b33939;
            max-width: 300px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h2 { color: #b33939; margin-top: 0; }
        .hint { font-size: 0.9em; color: #555; }
    </style>
</head>
<body>

    <div id="interface">
        <h2>Жылқының ішкі құрылысы</h2>
        <div id="content">Атты айналдырып, зерттеп көріңіз.</div>
        <hr>
        <p class="hint">🖱 Тінтуірмен айналдыру<br>🔍 Жақындату (Scroll)</p>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xe0e0e0);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3, 8);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Күшті, табиғи жарық
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 2);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(5, 5, 5);
        scene.add(dirLight);

        const loader = new GLTFLoader();
        let mixer, clock = new THREE.Clock();

        loader.load('https://raw.githack.com/mrdoob/three.js/master/examples/models/gltf/Horse.glb', (gltf) => {
            const model = gltf.scene;
            model.scale.set(0.015, 0.015, 0.015);
            scene.add(model);

            mixer = new THREE.AnimationMixer(model);
            mixer.clipAction(gltf.animations[0]).play();
            
            animate();
        });

        // Басқанда ақпарат шығару (Интерактивтілік)
        window.addEventListener('click', () => {
            const info = [
                "<b>🫀 Жүрек:</b> Жылқының жүрегі орташа 4 келі тартады. Ол өте мықты бұлшықет.",
                "<b>🫁 Өкпе:</b> Жылқы шапқанда минутына 150 рет тыныс ала алады.",
                "<b>🦴 Қаңқа:</b> Жылқының қаңқасы 205 сүйектен тұрады.",
                "<b>🐎 Шабыс:</b> Шауып бара жатқанда аттың төрт аяғы да жерге тимейтін сәттер болады."
            ];
            const randomInfo = info[Math.floor(Math.random() * info.length)];
            document.getElementById('content').innerHTML = randomInfo;
        });

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        function animate() {
            requestAnimationFrame(animate);
            if (mixer) mixer.update(clock.getDelta());
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
