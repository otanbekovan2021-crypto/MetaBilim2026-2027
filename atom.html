<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Quantum Atom - 3D Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Orbitron', sans-serif; }
        #ui {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 242, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid #00f2ff;
            padding: 20px; border-radius: 10px;
            color: #00f2ff; pointer-events: none;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
        }
        #subtitles {
            position: absolute; bottom: 40px; width: 100%;
            text-align: center; color: #fff;
            text-shadow: 0 0 10px #00f2ff, 0 0 20px #00f2ff;
            font-size: 1.5em; letter-spacing: 2px;
        }
        canvas { display: block; }
    </style>
</head>
<body>

<div id="ui">
    <h2 style="margin:0; font-size: 1.2em;">SYSTEM: ATOMIC_ENGINE v1.0</h2>
    <p style="font-size: 0.8em; color: #fff;">OBJECT: LITHIUM (Li) <br> PROTONS: 3 | NEUTRONS: 4</p>
</div>

<div id="subtitles">Кванттық деңгейге қош келдіңіз...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    let scene, camera, renderer, controls, clock;
    let electrons = [];
    let nucleusGroup;

    init();
    animate();

    function init() {
        scene = new THREE.Scene();
        clock = new THREE.Clock();
        
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 8, 15);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.autoRotate = true; // Авто-айналу қосу (эффект үшін)
        controls.autoRotateSpeed = 0.5;

        // Жұлдызды фон құру
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const posArray = new Float32Array(starsCount * 3);
        for(let i=0; i < starsCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 200;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const starsMaterial = new THREE.PointsMaterial({ size: 0.05, color: 0xffffff });
        const starsMesh = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starsMesh);

        // Жарық
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);
        const centralLight = new THREE.PointLight(0x00f2ff, 3, 50);
        scene.add(centralLight);

        // Ядро (Nucleus)
        nucleusGroup = new THREE.Group();
        scene.add(nucleusGroup);

        const sphereGeo = new THREE.SphereGeometry(0.6, 32, 32);
        
        // Протондар мен Нейтрондар (Неонды материалдар)
        for(let i=0; i<7; i++) {
            const isProton = i < 3;
            const mat = new THREE.MeshPhongMaterial({
                color: isProton ? 0xff0055 : 0x0055ff,
                emissive: isProton ? 0xff0055 : 0x0055ff,
                emissiveIntensity: 0.5,
                shininess: 100
            });
            const mesh = new THREE.Mesh(sphereGeo, mat);
            mesh.position.set(
                (Math.random()-0.5)*1.5,
                (Math.random()-0.5)*1.5,
                (Math.random()-0.5)*1.5
            );
            nucleusGroup.add(mesh);
        }

        // Электрондар
        createOrbit(6, 2, 0x00f2ff, 0.03);
        createOrbit(10, 1, 0x00f2ff, 0.015);

        window.addEventListener('resize', onWindowResize);
    }

    function createOrbit(radius, count, color, speed) {
        const orbitGroup = new THREE.Group();
        orbitGroup.rotation.x = Math.random() * Math.PI;
        orbitGroup.rotation.z = Math.random() * Math.PI;
        scene.add(orbitGroup);

        // Орбита сызығы (Неонды)
        const curve = new THREE.EllipseCurve(0, 0, radius, radius);
        const points = curve.getPoints(100);
        const geo = new THREE.BufferGeometry().setFromPoints(points);
        const mat = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.2 });
        const line = new THREE.Line(geo, mat);
        orbitGroup.add(line);

        // Электрон
        const eGeo = new THREE.SphereGeometry(0.25, 32, 32);
        const eMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        for(let i=0; i<count; i++) {
            const electron = new THREE.Mesh(eGeo, eMat);
            const glow = new THREE.PointLight(color, 2, 5); // Электронның өз жарығы
            electron.add(glow);
            
            electron.userData = { 
                angle: (i/count) * Math.PI * 2,
                speed: speed,
                radius: radius
            };
            orbitGroup.add(electron);
            electrons.push(electron);
        }
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getElapsedTime();

        nucleusGroup.rotation.y += 0.01;
        
        electrons.forEach(e => {
            e.userData.angle += e.userData.speed;
            e.position.x = Math.cos(e.userData.angle) * e.userData.radius;
            e.position.y = Math.sin(e.userData.angle) * e.userData.radius;
        });

        // Субтитрлерді өзгерту
        const sub = document.getElementById('subtitles');
        if(delta < 3) sub.innerText = "Атом ядросы: Протондар мен Нейтрондар тобы";
        else if(delta < 6) sub.innerText = "Электрондар кванттық орбитальдармен қозғалуда";
        else if(delta < 10) sub.innerText = "Литий (Li) - ең жеңіл металл";
        else sub.innerText = "Тінтуірмен айналдырып көріңіз...";

        controls.update();
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
