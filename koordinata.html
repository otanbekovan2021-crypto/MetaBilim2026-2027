<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <title>Үлкен Неонды Дельфин 3D</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #ui {
            position: absolute; top: 15px; width: 100%; text-align: center;
            color: #00ffff; font-family: 'Segoe UI', sans-serif; pointer-events: none;
            text-shadow: 0 0 15px #00ffff;
        }
    </style>
</head>
<body>
    <div id="ui">ТІНТУІР ДӨҢГЕЛЕГІМЕН ЖАҚЫНДАТЫҢЫЗ (ZOOM)<br>Дельфин 2 есе үлкейтілді</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // 1. САХНА ЖӘНЕ КАМЕРА
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    document.body.appendChild(renderer.domElement);

    // Камераны дельфинге жақын орналастыру
    camera.position.set(0, 0, 30);

    // 2. БАСҚАРУ (Zoom-ды барынша қосу)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;
    controls.zoomSpeed = 1.5; // Жақындату жылдамдығы
    controls.enableDamping = true; // Қозғалыстың жұмсақтығы
    controls.minDistance = 2;   // Ең жақын арақашықтық
    controls.maxDistance = 100; // Ең алыс арақашықтық

    // 3. ЖАРҚЫРАУ (BLOOM) ФИЛЬТРІ
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        2.5,  // Жарқырау күші
        0.4,  // Радиус
        0.1   // Табалдырық
    );
    composer.addPass(bloomPass);

    // 4. КООРДИНАТАЛЫҚ ЖҮЙЕ
    const grid = new THREE.GridHelper(60, 60, 0x222222, 0x111111);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    const axes = new THREE.AxesHelper(30);
    scene.add(axes);

    // 5. ДЕЛЬФИНДІ ҮЛКЕЙТІП ҚҰРУ
    const scaleFactor = 2; // Үлкейту коэффициенті
    const pointsData = [
        [12, 2], [5, 5], [2, 5], [-3, 7], [-1, 4.5], [-6, 4], [-11, -1], 
        [-7, -5], [-1, -7], [3, -8], [5, -11], [4, -7], [6, -5], [3, -6], 
        [2, -6], [-1, -5], [-6, -2], [0, -1], [-1, -3], [2, -2], [3, -1], 
        [5, -1], [4, 0], [8, 0], [9, 1], [12, 2]
    ];

    const points = pointsData.map(p => new THREE.Vector3(p[0] * scaleFactor, p[1] * scaleFactor, 0));
    const geometry = new THREE.BufferGeometry().setFromPoints(points);

    const material = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 });
    const dolphinLine = new THREE.Line(geometry, material);
    scene.add(dolphinLine);

    // Көзі (Үлкейтілген)
    const eye = new THREE.Mesh(
        new THREE.SphereGeometry(0.5, 16, 16),
        new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    eye.position.set(7.5 * scaleFactor, 3 * scaleFactor, 0.2);
    scene.add(eye);

    // 6. АНИМАЦИЯ
    function animate() {
        requestAnimationFrame(animate);
        
        // Нәзік қозғалыс қосу
        const time = Date.now() * 0.001;
        dolphinLine.position.y = Math.sin(time) * 0.5;
        eye.position.y = (3 * scaleFactor) + Math.sin(time) * 0.5;

        controls.update();
        composer.render();
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
